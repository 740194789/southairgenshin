server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: southair-genshin

  # 默认使用本地 H2 文件数据库，数据保存在 ./data 目录下
  datasource:
    url: jdbc:h2:file:./data/genshin;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 截图识别需要上传图片，放宽默认的 1MB 限制
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

# 业务配置
app:
  jwt:
    # 生产环境请务必替换为自己的密钥（建议 >= 32 字节）
    secret: southair-genshin-secret-key-change-me-in-production-2026
    expire-hours: 72

  # 图像识别：三种引擎按需启用
  ocr:
    # 视觉大模型：任意 OpenAI 兼容的多模态接口
    # 示例（阿里云百炼）：base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 示例（硅基流动）：base-url: https://api.siliconflow.cn/v1
    # 示例（智谱）：base-url: https://open.bigmodel.cn/api/paas/v4
    vision:
      base-url: ${SA_OCR_BASE_URL:}
      api-key: ${SA_OCR_API_KEY:}
      model: ${SA_OCR_MODEL:}
      timeout-seconds: 60
    # 本地 Tesseract：需安装 tesseract 与 chi_sim 语言包
    tesseract:
      command: ${SA_TESSERACT_CMD:tesseract}
      lang: chi_sim+eng
      timeout-seconds: 30

logging:
  level:
    root: info
    com.southair.genshin: debug

---
# 使用 MySQL 时：mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/southair_genshin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  h2:
    console:
      enabled: false
