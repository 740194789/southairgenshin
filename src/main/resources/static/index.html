<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#07080d"/>
    <meta name="description" content="南空提瓦特小助手 - 原神角色、武器与抽卡数据记录，Web 与手机端自适应"/>
    <title>南空提瓦特小助手 · 原神数据记录</title>
    <link rel="icon" type="image/png" href="/img/sandrone/portrait.png"/>
    <link rel="apple-touch-icon" href="/img/sandrone/portrait.png"/>
    <link rel="stylesheet" href="/css/app.css?v=20261109-02"/>
</head>
<body>
<div id="toast" class="toast" aria-live="polite"></div>

<!-- 登录 / 注册 -->
<section id="auth-view" class="auth-view">
    <div class="auth-glow"></div>
    <div class="auth-card">
        <div class="brand">
            <span class="brand-mark"><img src="/img/sandrone/portrait.png" alt="桑多涅"/></span>
            <div>
                <h1>南空提瓦特小助手</h1>
                <p id="app-subtitle">提瓦特数据记录 · Web / Mobile</p>
            </div>
        </div>

        <form id="auth-form" class="auth-form" autocomplete="off" novalidate>
            <label class="field">
                <span>账号</span>
                <input id="auth-username" type="text" placeholder="请输入账号" required minlength="3"/>
            </label>
            <label class="field">
                <span>密码</span>
                <input id="auth-password" type="password" placeholder="至少 6 位" required minlength="6"/>
            </label>
            <label class="field" id="auth-nickname-field" hidden>
                <span>昵称</span>
                <input id="auth-nickname" type="text" placeholder="游戏内昵称（可留空）" maxlength="32"/>
            </label>
            <button id="auth-submit" class="btn btn-primary" type="submit">登 录</button>
            <button id="auth-toggle" class="btn btn-text" type="button">没有账号？立即注册</button>
            <button id="auth-forgot" class="btn btn-text" type="button">忘记密码？</button>
        </form>

        <p class="auth-tip">数据默认保存在本地 H2 数据库，可通过 mysql profile 切换 MySQL</p>
    </div>
</section>

<!-- 主应用 -->
<div id="app-view" class="app-view" hidden>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand brand-sm">
                <span class="brand-mark"><img src="/img/sandrone/portrait.png" alt="桑多涅"/></span>
                <strong>南空提瓦特小助手</strong>
            </div>

            <div class="game-switch" id="game-switch" role="group" aria-label="切换游戏">
                <button class="game-btn active" type="button" data-game="genshin"
                        aria-pressed="true">原神</button>
                <button class="game-btn" type="button" data-game="starrail" title="崩坏：星穹铁道"
                        aria-pressed="false">星穹铁道</button>
            </div>

            <nav class="nav" id="nav">
                <button class="nav-btn active" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l5.3 3.7 2 6.6L12 21.2 4.7 13.1l2-6.6z"/><path d="M12 2.8v18.4"/><path d="M6.7 6.5h10.6"/></svg></span>资源</button>
                <button class="nav-btn" data-view="stats"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.6 5.4h14.8"/><path d="M4.6 5.4L2.7 2.9M19.4 5.4l1.9-2.5"/><path d="M7.2 5.4v4.4M16.8 5.4v4.4M12 5.4v8"/><circle cx="12" cy="17.6" r="2.6"/><path d="M7.2 9.8l2.8 4.7M16.8 9.8l-2.8 4.7"/></svg></span>统计</button>
                <button class="nav-btn" data-view="wishes"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 1.8v2.4"/><path d="M12 2.9l2.5 5.5 6.2.7-4.6 4.2 1.3 6.1-5.4-2.9-5.4 2.9 1.3-6.1L2.3 9.1l6.2-.7z"/><path d="M12 19.1v2.6"/></svg></span>抽卡</button>
                <button class="nav-btn" data-view="collection"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.2c-1.3-1-7.6-5.4-7.6-10a4.4 4.4 0 0 1 7.6-2.9 4.4 4.4 0 0 1 7.6 2.9c0 4.6-6.3 9-7.6 10z"/></svg></span>收藏</button>
                <button class="nav-btn" data-view="settings"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.4"/><circle cx="12" cy="12" r="2.7"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M5.1 18.9l1.7-1.7M17.2 6.8l1.7-1.7"/></svg></span>设置</button>
            </nav>

            <div class="user-area">
                <span id="user-name" class="user-name"></span>
                <button id="logout-btn" class="btn btn-text btn-sm" type="button">退出</button>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="view" id="view-dashboard"></section>
        <section class="view" id="view-stats" hidden></section>
        <section class="view" id="view-wishes" hidden></section>
        <section class="view" id="view-collection" hidden></section>
        <section class="view" id="view-settings" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar">
        <button class="tab-btn active" data-view="dashboard"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l5.3 3.7 2 6.6L12 21.2 4.7 13.1l2-6.6z"/><path d="M12 2.8v18.4"/><path d="M6.7 6.5h10.6"/></svg></span>资源</button>
        <button class="tab-btn" data-view="stats"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.6 5.4h14.8"/><path d="M4.6 5.4L2.7 2.9M19.4 5.4l1.9-2.5"/><path d="M7.2 5.4v4.4M16.8 5.4v4.4M12 5.4v8"/><circle cx="12" cy="17.6" r="2.6"/><path d="M7.2 9.8l2.8 4.7M16.8 9.8l-2.8 4.7"/></svg></span>统计</button>
        <button class="tab-btn" data-view="wishes"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 1.8v2.4"/><path d="M12 2.9l2.5 5.5 6.2.7-4.6 4.2 1.3 6.1-5.4-2.9-5.4 2.9 1.3-6.1L2.3 9.1l6.2-.7z"/><path d="M12 19.1v2.6"/></svg></span>抽卡</button>
        <button class="tab-btn" data-view="collection"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.2c-1.3-1-7.6-5.4-7.6-10a4.4 4.4 0 0 1 7.6-2.9 4.4 4.4 0 0 1 7.6 2.9c0 4.6-6.3 9-7.6 10z"/></svg></span>收藏</button>
        <button class="tab-btn" data-view="settings"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.4"/><circle cx="12" cy="12" r="2.7"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M5.1 18.9l1.7-1.7M17.2 6.8l1.7-1.7"/></svg></span>设置</button>
    </nav>
</div>

<script src="/js/avatars.js?v=20261113-01"></script>
<script src="/js/weapon-icons.js?v=20261113-01"></script>
<script src="/js/item-hashes.js?v=20261102-05"></script>
<script src="/js/constellation-names.js?v=20261107-01"></script>
<script src="/js/app.js?v=20261113-01"></script>
</body>
</html>
