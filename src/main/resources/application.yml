server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: southair-genshin

  # 默认使用本地 H2 文件数据库，数据保存在 ./data 目录下
  datasource:
    url: jdbc:h2:file:./data/genshin;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 截图识别需要上传图片，放宽默认的 1MB 限制
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

# 业务配置
app:
  jwt:
    # 生产环境请务必替换为自己的密钥（建议 >= 32 字节）
    secret: southair-genshin-secret-key-change-me-in-production-2026
    expire-hours: 72

  # 图鉴数据源（仅在线刷新时使用，可替换为镜像地址）
  catalog:
    genshin-url: https://gi.yatta.moe/api/v2/chs/avatar
    # 使用 jsDelivr 镜像，raw.githubusercontent.com 在部分网络下不可达
    starrail-url: https://fastly.jsdelivr.net/gh/Mar-7th/StarRailRes@master/index_min/cn/characters.json

  # 图像识别：本地 Tesseract 与浏览器 OCR 两种引擎
  ocr:
    # 本地 Tesseract：需安装 tesseract 与 chi_sim 语言包
    tesseract:
      command: ${SA_TESSERACT_CMD:tesseract}
      lang: chi_sim+eng
      timeout-seconds: 30

logging:
  level:
    root: info
    com.southair.genshin: debug

---
# 使用 MySQL 时：mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/southair_genshin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  h2:
    console:
      enabled: false
