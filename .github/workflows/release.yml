name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build jar
        run: mvn -B -DskipTests package

      - name: Prepare asset
        run: |
          cp target/southair-genshin.jar SouthAirGenshin.jar
          cp launcher/release/SouthAirLauncher.exe SouthAirLauncher.exe
          ls -lh SouthAirGenshin.jar SouthAirLauncher.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: SouthAirGenshin build-${{ github.sha }}
          body: |
            提交：${{ github.sha }}
            构建：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            启动器的「检查更新」会自动下载 `SouthAirGenshin.jar` 与 `SouthAirLauncher.exe`
            并完成替换（jar 立即生效，启动器本体重新打开后生效），无需手动操作。
          files: |
            SouthAirGenshin.jar
            SouthAirLauncher.exe
          fail_on_unmatched_files: true
